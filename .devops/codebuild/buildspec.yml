version: 0.2

env:
  shell: bash
  variables:
    SERVICE_NAME: port-view
    ECR_REPOSITORY: portfolio-view
    AWS_REGION: ap-northeast-2
    EVIDENCE_DIR: evidence

phases:
  install:
    commands:
      - |
        set -euo pipefail

        java -version
        ./mvnw --version
        docker version
        aws --version

  pre_build:
    commands:
      - |
        set -euo pipefail

        test -f pom.xml
        test -f Dockerfile
        test -x mvnw

        mkdir -p "${EVIDENCE_DIR}"

        SOURCE_SHA="${CODEBUILD_RESOLVED_SOURCE_VERSION:-unknown}"
        IMAGE_TAG="$(printf '%s' "${SOURCE_SHA}" | cut -c1-12)"
        AWS_ACCOUNT_ID="$(aws sts get-caller-identity --query Account --output text)"
        ECR_REGISTRY="${AWS_ACCOUNT_ID}.dkr.ecr.${AWS_REGION}.amazonaws.com"
        ECR_IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${IMAGE_TAG}"

        export SOURCE_SHA
        export IMAGE_TAG
        export AWS_ACCOUNT_ID
        export ECR_REGISTRY
        export ECR_IMAGE_URI

        printf 'service=%s\n' "${SERVICE_NAME}" > "${EVIDENCE_DIR}/build.env"
        printf 'source_sha=%s\n' "${SOURCE_SHA}" >> "${EVIDENCE_DIR}/build.env"
        printf 'image_tag=%s\n' "${IMAGE_TAG}" >> "${EVIDENCE_DIR}/build.env"
        printf 'ecr_repository=%s\n' "${ECR_REPOSITORY}" >> "${EVIDENCE_DIR}/build.env"
        printf 'ecr_image_uri=%s\n' "${ECR_IMAGE_URI}" >> "${EVIDENCE_DIR}/build.env"
        printf 'codebuild_build_id=%s\n' "${CODEBUILD_BUILD_ID:-unknown}" \
          >> "${EVIDENCE_DIR}/build.env"

        aws ecr get-login-password \
          --region "${AWS_REGION}" \
          | docker login \
              --username AWS \
              --password-stdin "${ECR_REGISTRY}"

  build:
    commands:
      - |
        set -euo pipefail

        ./mvnw -B -ntp test
        ./mvnw -B -ntp -DskipTests clean package

        mapfile -t JAR_FILES < <(
          find target \
            -maxdepth 1 \
            -type f \
            -name '*.jar' \
            ! -name '*.original' \
            | sort
        )

        if [ "${#JAR_FILES[@]}" -ne 1 ]; then
          printf 'Expected exactly one executable JAR, found %s\n' \
            "${#JAR_FILES[@]}" >&2

          printf '%s\n' "${JAR_FILES[@]:-}" >&2
          exit 1
        fi

        JAR_FILE="${JAR_FILES[0]}"

        printf 'jar_file=%s\n' "${JAR_FILE}" \
          >> "${EVIDENCE_DIR}/build.env"

        docker build \
          --tag "${SERVICE_NAME}:${IMAGE_TAG}" \
          --tag "${ECR_IMAGE_URI}" \
          .

        docker image inspect \
          "${ECR_IMAGE_URI}" \
          --format '{{.Id}}' \
          > "${EVIDENCE_DIR}/image-id.txt"

        docker push "${ECR_IMAGE_URI}" \
          | tee "${EVIDENCE_DIR}/ecr-push.txt"

        IMAGE_DIGEST="$(
          awk '/digest: sha256:/ {print $2; exit}' \
            "${EVIDENCE_DIR}/ecr-push.txt"
        )"

        if [ -z "${IMAGE_DIGEST}" ]; then
          printf '%s\n' 'ECR image digest was not found.' >&2
          exit 1
        fi

        printf '%s\n' "${IMAGE_DIGEST}" \
          > "${EVIDENCE_DIR}/image-digest.txt"

        printf 'image_digest=%s\n' "${IMAGE_DIGEST}" \
          >> "${EVIDENCE_DIR}/build.env"

  post_build:
    commands:
      - |
        set -u

        if [ "${CODEBUILD_BUILD_SUCCEEDING:-0}" -eq 1 ]; then
          printf 'result=SUCCESS\n' >> "${EVIDENCE_DIR}/build.env"
        else
          printf 'result=FAILED\n' >> "${EVIDENCE_DIR}/build.env"
        fi

        printf '%s\n' '--- build evidence ---'

        if [ -f "${EVIDENCE_DIR}/build.env" ]; then
          cat "${EVIDENCE_DIR}/build.env"
        fi

        if [ -f "${EVIDENCE_DIR}/image-id.txt" ]; then
          printf '%s\n' '--- docker image id ---'
          cat "${EVIDENCE_DIR}/image-id.txt"
        fi

        if [ -f "${EVIDENCE_DIR}/image-digest.txt" ]; then
          printf '%s\n' '--- ecr image digest ---'
          cat "${EVIDENCE_DIR}/image-digest.txt"
        fi

artifacts:
  files:
    - evidence/**/*
  discard-paths: false

cache:
  paths:
    - /root/.m2/**/*