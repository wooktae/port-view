# CI profile for context smoke tests.
# This profile must not connect to local PostgreSQL or AWS RDS.

# ------------------------------
# H2 datasource
# ------------------------------
spring.datasource.url=jdbc:h2:mem:port_view_ci;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# ------------------------------
# JPA / Hibernate
# ------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------
# External execution disabled
# ------------------------------
portfolio.snapshot-refresh.enabled=false
portfolio.order-refresh.enabled=false
portfolio.strategy.execution.submit-enabled=false

portfolio.batch.execution-enabled=false
portfolio.batch.local-file-execution-enabled=false
portfolio.batch.aws-stepfunctions-start-enabled=false
portfolio.batch.aws-stepfunctions-step-start-enabled=false
portfolio.batch.intraday-monitor-enabled=false
portfolio.batch.slack-action-enabled=false
portfolio.batch.slack-summary-enabled=false
portfolio.batch.full-pipeline-execution-enabled=false
portfolio.batch.paper-order-enabled=false

slack.enabled=false
slack.webhook-url=
