# AWS Paper profile for local port-view verification.
# Local Spring Boot process reads AWS Paper RDS through local port-forward.
# Do not put real secrets in this file.

# ------------------------------
# Server settings
# ------------------------------
server.port=${PORT_VIEW_SERVER_PORT:8080}

# ------------------------------
# PostgreSQL datasource
# ------------------------------
spring.datasource.url=jdbc:postgresql://${INTEREST_DB_HOST:127.0.0.1}:${INTEREST_DB_PORT:15433}/${INTEREST_DB_NAME:portfolio}
spring.datasource.username=${INTEREST_DB_USER:view_app}
spring.datasource.password=${INTEREST_DB_PASSWORD}
spring.datasource.hikari.connection-init-sql=SET search_path TO ops, execution, decision, research, connector, preprocessor, interest, reference, legacy, public

# ------------------------------
# JPA / Hibernate settings
# ------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false
spring.jpa.open-in-view=false

# ------------------------------
# Account
# ------------------------------
portfolio.view.account.default-account-no=${PORTFOLIO_VIEW_ACCOUNT_DEFAULT_ACCOUNT_NO:}
portfolio.batch.default-account-no=${PORTFOLIO_BATCH_DEFAULT_ACCOUNT_NO:${PORTFOLIO_VIEW_ACCOUNT_DEFAULT_ACCOUNT_NO:}}

# ------------------------------
# AWS Paper menu visibility
# ------------------------------
portfolio.view.menu.dashboard-enabled=true
portfolio.view.menu.balance-enabled=true
portfolio.view.menu.positions-enabled=true
portfolio.view.menu.orders-enabled=true
portfolio.view.menu.strategy-enabled=true
portfolio.view.menu.daily-batch-enabled=true
portfolio.view.menu.report-enabled=true

# ------------------------------
# Read-only / refresh controls
# ------------------------------
portfolio.snapshot-refresh.enabled=${PORTFOLIO_SNAPSHOT_REFRESH_ENABLED:true}
portfolio.order-refresh.enabled=false
portfolio.strategy.execution.submit-enabled=false
portfolio.dashboard.snapshot-refresh-enabled=${PORTFOLIO_DASHBOARD_SNAPSHOT_REFRESH_ENABLED:true}
portfolio.snapshot-refresh.stale-minutes=${PORTFOLIO_SNAPSHOT_REFRESH_STALE_MINUTES:0}
portfolio.snapshot-refresh.timeout-seconds=${PORTFOLIO_SNAPSHOT_REFRESH_TIMEOUT_SECONDS:60}
portfolio.snapshot-refresh.python-executable=${PORTFOLIO_SNAPSHOT_REFRESH_PYTHON_EXECUTABLE:python}
portfolio.snapshot-refresh.marketconnector-dir=${PORTFOLIO_SNAPSHOT_REFRESH_MARKETCONNECTOR_DIR:C:/Workspaces/port-marketconnector}
portfolio.snapshot-refresh.balance-script-name=${PORTFOLIO_SNAPSHOT_REFRESH_BALANCE_SCRIPT_NAME:connector_balance.py}

# ------------------------------
# Slack
# ------------------------------
slack.enabled=false
slack.webhook-url=${SLACK_WEBHOOK_URL:}

# ------------------------------
# Connector
# ------------------------------
connector.base-url=${CONNECTOR_BASE_URL:http://127.0.0.1:5000}

# ------------------------------
# Daily Batch identity
# ------------------------------
portfolio.batch.environment=paper
portfolio.batch.db-target=${PORTFOLIO_BATCH_DB_TARGET:aws-paper-rds}
portfolio.batch.execution-mode=${PORTFOLIO_BATCH_EXECUTION_MODE:local-file}

# ------------------------------
# Daily Batch local source paths
# ------------------------------
portfolio.batch.workspace-root=${PORTFOLIO_BATCH_WORKSPACE_ROOT:C:/Workspaces}
portfolio.batch.marketconnector-dir=${PORTFOLIO_BATCH_MARKETCONNECTOR_DIR:C:/Workspaces/port-marketconnector}
portfolio.batch.interest-crawler-dir=${PORTFOLIO_BATCH_INTEREST_CRAWLER_DIR:C:/Workspaces/port-interest-crawler}
portfolio.batch.preprocessor-dir=${PORTFOLIO_BATCH_PREPROCESSOR_DIR:C:/Workspaces/port-interest-preprocessor}
portfolio.batch.execution-dir=${PORTFOLIO_BATCH_EXECUTION_DIR:C:/Workspaces/port_strategy_execution}

# ------------------------------
# Daily Batch execution gates
# ------------------------------
# Keep global execution disabled until range execution / order gate patch is complete.
portfolio.batch.execution-enabled=${PORTFOLIO_BATCH_EXECUTION_ENABLED:false}
portfolio.batch.local-file-execution-enabled=${PORTFOLIO_BATCH_LOCAL_FILE_EXECUTION_ENABLED:false}
portfolio.batch.aws-stepfunctions-start-enabled=${PORTFOLIO_BATCH_AWS_STEPFUNCTIONS_START_ENABLED:false}
portfolio.batch.aws-stepfunctions-step-start-enabled=${PORTFOLIO_BATCH_AWS_STEPFUNCTIONS_STEP_START_ENABLED:false}
portfolio.batch.intraday-monitor-enabled=${PORTFOLIO_BATCH_INTRADAY_MONITOR_ENABLED:false}
portfolio.batch.slack-action-enabled=${PORTFOLIO_BATCH_SLACK_ACTION_ENABLED:false}
portfolio.batch.slack-summary-enabled=${PORTFOLIO_BATCH_SLACK_SUMMARY_ENABLED:false}

portfolio.batch.full-pipeline-execution-enabled=${PORTFOLIO_BATCH_FULL_PIPELINE_EXECUTION_ENABLED:false}

# ------------------------------
# Daily Batch safety gates for phase 2
# ------------------------------
# Step 10~12 order-like execution must remain blocked until explicitly enabled.
portfolio.batch.paper-order-enabled=${PORTFOLIO_BATCH_PAPER_ORDER_ENABLED:false}

# Optional range execution defaults.
portfolio.batch.min-executable-step-order=${PORTFOLIO_BATCH_MIN_EXECUTABLE_STEP_ORDER:1}
portfolio.batch.max-executable-step-order=${PORTFOLIO_BATCH_MAX_EXECUTABLE_STEP_ORDER:11}

# ------------------------------
# Daily Batch process settings
# ------------------------------
portfolio.batch.python-executable=${PORTFOLIO_BATCH_PYTHON_EXECUTABLE:python}
portfolio.batch.command-timeout-minutes=${PORTFOLIO_BATCH_COMMAND_TIMEOUT_MINUTES:60}
portfolio.batch.log-tail-length=${PORTFOLIO_BATCH_LOG_TAIL_LENGTH:8000}