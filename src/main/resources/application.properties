spring.application.name=port-view

# ------------------------------
# Server 설정 (원하면 포트 변경)
# ------------------------------
server.port=8080

# ------------------------------
# PostgreSQL 데이터베이스 연결
# ------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5433/interest_crawler
spring.datasource.username=postgres
spring.datasource.password=doflwhsk3768!
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------
# JPA / Hibernate 설정
# ------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------
# Portfolio View 설정
# ------------------------------
portfolio.view.account.default-account-no=50187518

portfolio.view.dashboard.recent-order-limit=5
portfolio.view.dashboard.recent-trade-limit=5

portfolio.view.orders.default-limit=50

portfolio.view.positions.default-limit=50

portfolio.view.strategy-execution.default-plan-limit=50
portfolio.view.strategy-execution.default-order-limit=50

# ------------------------------
# Market Connector 설정
# ------------------------------
connector.base-url=http://127.0.0.1:5000

connector.api.balance-latest-path=/api/v1/view/balance/latest
connector.api.positions-latest-path=/api/v1/view/positions/latest
connector.api.orders-path=/api/v1/view/orders
connector.api.order-detail-path=/api/v1/view/orders
connector.api.realtime-price-path=/api/v1/price
connector.api.eod-price-path=/api/v1/view/quotes/eod

# ------------------------------
# Daily Batch Pipeline 설정
# ------------------------------
# View의 "Daily 배치" 화면에서 Python Daily Pipeline을 실행하기 위한 설정.
# 경로는 Java 코드에 하드코딩하지 않고 여기서만 관리한다.

portfolio.batch.python-executable=python

# Workspace Root
portfolio.batch.workspace-root=C:/Workspaces

# 각 Microservice 작업 디렉토리
portfolio.batch.marketconnector-dir=C:/Workspaces/port-marketconnector
portfolio.batch.interest-crawler-dir=C:/Workspaces/port-interest-crawler
portfolio.batch.preprocessor-dir=C:/Workspaces/port-interest-preprocessor
portfolio.batch.execution-dir=C:/Workspaces/port_strategy_execution

# 실행 계좌 / 환경
portfolio.batch.default-account-no=50187518
portfolio.batch.environment=local

# 실행 제어
portfolio.batch.command-timeout-minutes=60
portfolio.batch.log-tail-length=8000

# ------------------------------
# Slack Notification 설정
# ------------------------------
slack.enabled=true
slack.webhook-url=${SLACK_WEBHOOK_URL:}

