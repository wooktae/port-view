spring.application.name=port-view

# ------------------------------
# Server settings
# ------------------------------
server.port=${PORT_VIEW_SERVER_PORT:8080}

# ------------------------------
# PostgreSQL datasource
# ------------------------------
spring.datasource.url=jdbc:postgresql://${INTEREST_DB_HOST:localhost}:${INTEREST_DB_PORT:5433}/${INTEREST_DB_NAME:portfolio}
spring.datasource.username=${INTEREST_DB_USER:postgres}
spring.datasource.password=${INTEREST_DB_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.datasource.hikari.connection-init-sql=SET search_path TO ops, execution, decision, research, connector, preprocessor, interest, reference, legacy, public

# ------------------------------
# JPA / Hibernate settings
# ------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------
# Portfolio View settings
# ------------------------------
portfolio.view.account.default-account-no=${PORTFOLIO_VIEW_ACCOUNT_DEFAULT_ACCOUNT_NO:}

# Menu visibility.
# Keep default true for existing local behavior. aws-paper overrides this to balance/positions only.
portfolio.view.menu.dashboard-enabled=${PORTFOLIO_VIEW_MENU_DASHBOARD_ENABLED:true}
portfolio.view.menu.balance-enabled=${PORTFOLIO_VIEW_MENU_BALANCE_ENABLED:true}
portfolio.view.menu.positions-enabled=${PORTFOLIO_VIEW_MENU_POSITIONS_ENABLED:true}
portfolio.view.menu.orders-enabled=${PORTFOLIO_VIEW_MENU_ORDERS_ENABLED:true}
portfolio.view.menu.strategy-enabled=${PORTFOLIO_VIEW_MENU_STRATEGY_ENABLED:true}
portfolio.view.menu.daily-batch-enabled=${PORTFOLIO_VIEW_MENU_DAILY_BATCH_ENABLED:true}
portfolio.view.menu.report-enabled=${PORTFOLIO_VIEW_MENU_REPORT_ENABLED:true}

# ------------------------------
# Market Connector settings
# ------------------------------
connector.base-url=${CONNECTOR_BASE_URL:http://127.0.0.1:5000}

# ------------------------------
# Daily Batch Pipeline settings
# ------------------------------
# Settings for running the Python Daily Pipeline from the Daily Batch page.
# Environment-specific paths should be provided via environment variables or local config.

portfolio.batch.python-executable=${PORTFOLIO_BATCH_PYTHON_EXECUTABLE:python}

# Workspace Root
portfolio.batch.workspace-root=${PORTFOLIO_BATCH_WORKSPACE_ROOT:}

# Microservice working directories
portfolio.batch.marketconnector-dir=${PORTFOLIO_BATCH_MARKETCONNECTOR_DIR:}
portfolio.batch.interest-crawler-dir=${PORTFOLIO_BATCH_INTEREST_CRAWLER_DIR:}
portfolio.batch.preprocessor-dir=${PORTFOLIO_BATCH_PREPROCESSOR_DIR:}
portfolio.batch.execution-dir=${PORTFOLIO_BATCH_EXECUTION_DIR:}

# Execution account / environment
portfolio.batch.default-account-no=${PORTFOLIO_BATCH_DEFAULT_ACCOUNT_NO:}
portfolio.batch.environment=${PORTFOLIO_BATCH_ENVIRONMENT:local}

# Execution controls
portfolio.batch.command-timeout-minutes=${PORTFOLIO_BATCH_COMMAND_TIMEOUT_MINUTES:60}
portfolio.batch.log-tail-length=${PORTFOLIO_BATCH_LOG_TAIL_LENGTH:8000}

# ------------------------------
# Snapshot refresh settings
# ------------------------------
# Default false: View should not execute connector scripts unless explicitly enabled.
portfolio.snapshot-refresh.enabled=${PORTFOLIO_SNAPSHOT_REFRESH_ENABLED:false}
portfolio.snapshot-refresh.stale-minutes=${PORTFOLIO_SNAPSHOT_REFRESH_STALE_MINUTES:0}
portfolio.snapshot-refresh.timeout-seconds=${PORTFOLIO_SNAPSHOT_REFRESH_TIMEOUT_SECONDS:60}
portfolio.snapshot-refresh.python-executable=${PORTFOLIO_SNAPSHOT_REFRESH_PYTHON_EXECUTABLE:python}
portfolio.snapshot-refresh.marketconnector-dir=${PORTFOLIO_SNAPSHOT_REFRESH_MARKETCONNECTOR_DIR:}
portfolio.snapshot-refresh.balance-script-name=${PORTFOLIO_SNAPSHOT_REFRESH_BALANCE_SCRIPT_NAME:connector_balance.py}
portfolio.order-refresh.enabled=${PORTFOLIO_ORDER_REFRESH_ENABLED:false}

# ------------------------------
# Slack Notification settings
# ------------------------------
slack.enabled=${SLACK_ENABLED:false}
slack.webhook-url=${SLACK_WEBHOOK_URL:}
slack.locale=${SLACK_LOCALE:en}
