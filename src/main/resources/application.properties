spring.application.name=port-view

# ------------------------------
# Server settings
# ------------------------------
server.port=8080

# ------------------------------
# PostgreSQL datasource
# ------------------------------
spring.datasource.url=${SPRING_DATASOURCE_URL:}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME:}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver

# ------------------------------
# JPA / Hibernate settings
# ------------------------------
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# ------------------------------
# Portfolio View settings
# ------------------------------
portfolio.view.account.default-account-no=${PORTFOLIO_VIEW_ACCOUNT_DEFAULT_ACCOUNT_NO:}

portfolio.view.dashboard.recent-order-limit=5
portfolio.view.dashboard.recent-trade-limit=5

portfolio.view.orders.default-limit=50

portfolio.view.positions.default-limit=50

portfolio.view.strategy-execution.default-plan-limit=50
portfolio.view.strategy-execution.default-order-limit=50

# ------------------------------
# Market Connector settings
# ------------------------------
connector.base-url=${CONNECTOR_BASE_URL:http://127.0.0.1:5000}

connector.api.balance-latest-path=/api/v1/view/balance/latest
connector.api.positions-latest-path=/api/v1/view/positions/latest
connector.api.orders-path=/api/v1/view/orders
connector.api.order-detail-path=/api/v1/view/orders
connector.api.realtime-price-path=/api/v1/price
connector.api.eod-price-path=/api/v1/view/quotes/eod

# ------------------------------
# Daily Batch Pipeline settings
# ------------------------------
# Settings for running the Python Daily Pipeline from the Daily Batch page.
# Environment-specific paths should be provided via environment variables or local config.

portfolio.batch.python-executable=python

# Workspace Root
portfolio.batch.workspace-root=${PORTFOLIO_BATCH_WORKSPACE_ROOT:}

# Microservice working directories
portfolio.batch.marketconnector-dir=${PORTFOLIO_BATCH_MARKETCONNECTOR_DIR:}
portfolio.batch.interest-crawler-dir=${PORTFOLIO_BATCH_INTEREST_CRAWLER_DIR:}
portfolio.batch.preprocessor-dir=${PORTFOLIO_BATCH_PREPROCESSOR_DIR:}
portfolio.batch.execution-dir=${PORTFOLIO_BATCH_EXECUTION_DIR:}

# Execution account / environment
portfolio.batch.default-account-no=${PORTFOLIO_BATCH_DEFAULT_ACCOUNT_NO:}
portfolio.batch.environment=${PORTFOLIO_BATCH_ENVIRONMENT:local}

# Execution controls
portfolio.batch.command-timeout-minutes=60
portfolio.batch.log-tail-length=8000

# ------------------------------
# Slack Notification settings
# ------------------------------
slack.enabled=${SLACK_ENABLED:false}
slack.webhook-url=${SLACK_WEBHOOK_URL:}
