<!DOCTYPE html>
<html lang="ko" xmlns:th="http://www.thymeleaf.org">
<body>
<aside class="app-sidebar" th:fragment="sidebar(activeMenu, accountNo)">
    <div class="sidebar-brand">
        <a class="brand-mark"
           th:href="@{/balance-summary(accountNo=${accountNo})}"
           aria-label="Portfolio View Home">
            <span>PV</span>
        </a>
        <div class="brand-copy">
            <strong>Portfolio View</strong>
            <small>Quant Ops Console</small>
        </div>
    </div>

    <nav class="sidebar-nav" aria-label="Primary Navigation" th:aria-label="#{nav.primary}">
        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.dashboard-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'dashboard'} ? ' active' : ''"
           th:href="@{/dashboard(accountNo=${accountNo})}">
            <span class="sidebar-icon">⌂</span>
            <span class="sidebar-text" th:text="#{nav.dashboard}">Dashboard</span>
        </a>

        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.balance-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'balance'} ? ' active' : ''"
           th:href="@{/balance-summary(accountNo=${accountNo})}">
            <span class="sidebar-icon">₩</span>
            <span class="sidebar-text" th:text="#{nav.balance}">Balance</span>
        </a>

        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.positions-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'positions'} ? ' active' : ''"
           th:href="@{/positions(accountNo=${accountNo})}">
            <span class="sidebar-icon">▦</span>
            <span class="sidebar-text" th:text="#{nav.positions}">Positions</span>
        </a>

        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.orders-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'orders'} ? ' active' : ''"
           th:href="@{/orders(accountNo=${accountNo})}">
            <span class="sidebar-icon">↕</span>
            <span class="sidebar-text" th:text="#{nav.orders}">Orders</span>
        </a>

        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.strategy-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'strategy'} ? ' active' : ''"
           th:href="@{/strategy/execution/plans}">
            <span class="sidebar-icon">◇</span>
            <span class="sidebar-text" th:text="#{nav.strategy}">Strategy Operations</span>
        </a>

        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.daily-batch-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'daily-batch'} ? ' active' : ''"
           th:href="@{/daily-batch(accountNo=${accountNo})}">
            <span class="sidebar-icon">⟳</span>
            <span class="sidebar-text" th:text="#{nav.dailyBatch}">Daily Batch</span>
        </a>

        <a class="sidebar-link"
           th:if="${@environment.getProperty('portfolio.view.menu.report-enabled', 'true') == 'true'}"
           th:classappend="${activeMenu == 'report'} ? ' active' : ''"
           th:href="@{/strategy/reports/latest}">
            <span class="sidebar-icon">⌁</span>
            <span class="sidebar-text" th:text="#{nav.report}">Backtest Report</span>
        </a>
    </nav>

    <div class="sidebar-spacer"></div>

    <div class="sidebar-language-switch" role="group" aria-label="EN / KO">
        <a class="sidebar-language-link"
           href="?lang=en"
           lang="en"
           hreflang="en"
           th:classappend="${#locale.language == 'en'} ? ' active' : ''">EN</a>
        <span class="sidebar-language-separator" aria-hidden="true">|</span>
        <a class="sidebar-language-link"
           href="?lang=ko"
           lang="ko"
           hreflang="ko"
           th:classappend="${#locale.language == 'ko'} ? ' active' : ''">KO</a>
    </div>

    <div class="sidebar-card">
        <div class="sidebar-card-kicker">SNAPSHOT REFRESH</div>
        <strong th:text="#{sidebar.console}">Operations Console v2</strong>
        <p th:text="#{sidebar.snapshotDescription}">Refreshes the AWS Paper account Snapshot and displays DB-backed data.</p>
    </div>
</aside>
</body>
</html>
